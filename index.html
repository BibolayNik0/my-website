<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Покемон GO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #101a33;
    --bg2: #18264a;
    --glass: rgba(16, 26, 51, 0.72);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f3f6ff;
    --muted: #9fb0d3;
    --accent: #ffcb05;
    --accent-d: #c99a00;
    --blue: #3d7dca;
    --red: #e5484d;
    --green: #30a46c;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Nunito, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { border: 0; cursor: pointer; background: none; }
  img { -webkit-user-drag: none; user-select: none; }
  #map { position: fixed; inset: 0; z-index: 0; }
  .maplibregl-ctrl-attrib { font-size: 10px; }

  .glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }

  /* ---------- HUD ---------- */
  .top { position: fixed; z-index: 500; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); pointer-events: none; }
  .top > * { pointer-events: auto; }
  .trainer { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border-radius: 999px; padding: 5px 14px 5px 5px; }
  .lvl-badge { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #222; flex: none;
    background: radial-gradient(circle at 35% 30%, #fff6b0, var(--accent) 45%, var(--accent-d)); box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }
  .trainer .info { flex: 1; min-width: 0; }
  .trainer .info small { color: var(--muted); font-size: 11px; display: block; }
  .xpbar { height: 7px; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; margin-top: 3px; }
  .xpbar i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #ffe66b, var(--accent)); transition: width .5s; }
  .chip { border-radius: 999px; padding: 9px 13px; display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  #incenseChip { display: none; color: #ffb3f0; }
  #incenseChip.on { display: flex; }
  .status { position: fixed; z-index: 500; top: calc(max(12px, env(safe-area-inset-top)) + 58px); left: 50%; transform: translateX(-50%);
    padding: 6px 14px; border-radius: 999px; font-size: 12px; color: #dfe7ff; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }

  .side { position: fixed; z-index: 500; right: 16px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 170px); display: flex; flex-direction: column; gap: 10px; }
  .fab { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; transition: transform .1s; }
  .fab:active, .navbtn:active { transform: scale(.92); }
  #compassIcon { display: inline-block; transition: transform .2s; }

  .radar { position: fixed; z-index: 500; left: 16px; right: 16px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 92px);
    border-radius: 16px; padding: 6px 8px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; align-items: center; }
  .radar::-webkit-scrollbar { display: none; }
  .radar.hidden { display: none; }
  .radar .lbl { font-size: 11px; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); padding: 0 2px; flex: none; }
  .rad-item { flex: none; width: 54px; border-radius: 12px; padding: 2px 0 4px; text-align: center; font-size: 10px; color: var(--muted); }
  .rad-item img { width: 44px; height: 44px; image-rendering: pixelated; display: block; margin: 0 auto -4px; }
  .rad-item.near { background: rgba(48,164,108,.28); color: #b6f5d3; }
  .rad-item.shiny { box-shadow: inset 0 0 0 2px rgba(255,203,5,.7); }
  .radar .empty { font-size: 12px; color: var(--muted); padding: 10px 6px; }

  .navbar { position: fixed; z-index: 500; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; align-items: flex-end;
    padding: 0 16px max(14px, env(safe-area-inset-bottom)); pointer-events: none; }
  .navbar > * { pointer-events: auto; }
  .navbtn { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; position: relative; transition: transform .1s; }
  .navbtn .dot { position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--red); font-size: 11px;
    display: none; place-items: center; font-weight: 900; padding: 0 5px; border: 2px solid var(--bg); }
  .navbtn .dot.on { display: grid; }
  .pokebtn { width: 78px; height: 78px; border-radius: 50%; position: relative;
    background: linear-gradient(#ee3b3b 0 46%, #1b1b1b 46% 54%, #f4f4f4 54%);
    box-shadow: inset -8px -10px 16px rgba(0,0,0,.35), inset 6px 8px 12px rgba(255,255,255,.35), 0 10px 22px rgba(0,0,0,.45); }
  .pokebtn::before { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff, #ddd 60%, #999); box-shadow: 0 0 0 5px #1b1b1b; }
  .pokebtn::after { content: ""; position: absolute; left: 16%; top: 10%; width: 28%; height: 20%; border-radius: 50%; background: rgba(255,255,255,.5); filter: blur(2px); }

  .dpad { position: fixed; z-index: 500; left: 16px; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 170px); display: none;
    grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px; }
  .dpad.on { display: grid; }
  .dpad button { border-radius: 12px; font-size: 18px; }
  .dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; }
  .dpad .r { grid-column: 3; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 3; }

  /* ---------- Map markers ---------- */
  .ground-marker { width: 0; height: 0; pointer-events: none; }
  .ground-marker .range, .ground-marker .pulse { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; }
  .ground-marker .range { border: 2px solid rgba(61,125,202,.85); background: radial-gradient(rgba(61,125,202,.05), rgba(61,125,202,.22)); }
  .ground-marker .pulse { width: 40px; height: 40px; background: rgba(61,125,202,.5); animation: pulse 2s ease-out infinite; }
  @keyframes pulse { from { width: 20px; height: 20px; opacity: .9; } to { width: 120px; height: 120px; opacity: 0; } }
  .avatar { width: 34px; height: 52px; pointer-events: none; }
  .ava-body { position: absolute; left: 3px; top: 0; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #fff;
    background: radial-gradient(circle at 35% 30%, #9cc8ff, #3d7dca 50%, #1d4f91); box-shadow: 0 4px 8px rgba(0,0,0,.4); animation: ava 1.6s ease-in-out infinite; }
  .ava-body::after { content: ""; position: absolute; left: 50%; bottom: -14px; margin-left: -2px; width: 4px; height: 12px; background: #fff; border-radius: 2px; }
  .ava-shadow { position: absolute; left: 50%; bottom: 0; width: 22px; height: 8px; margin-left: -11px; border-radius: 50%; background: rgba(0,0,0,.35); }
  @keyframes ava { 50% { transform: translateY(-4px); } }

  .mon { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding-bottom: 4px; transition: opacity .3s, filter .3s; }
  .mon .spr { position: relative; z-index: 1; animation: bob 1.8s ease-in-out infinite; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); pointer-events: none; }
  .mon .spr.anim { max-width: 96px; max-height: 84px; transform-origin: bottom; image-rendering: pixelated; }
  .mon .spr.pixel { width: 76px; height: 76px; image-rendering: pixelated; margin-bottom: -16px; }
  .mon-shadow { position: absolute; bottom: 0; left: 50%; width: 46px; height: 12px; margin-left: -23px; border-radius: 50%; background: rgba(0,0,0,.32); }
  .mon.r3 .mon-shadow { background: radial-gradient(rgba(255,203,5,.95), rgba(255,203,5,0) 70%); width: 70px; height: 20px; margin-left: -35px; bottom: -4px; }
  .mon.r4 .mon-shadow { background: radial-gradient(rgba(190,90,255,.95), rgba(190,90,255,0) 70%); width: 80px; height: 22px; margin-left: -40px; bottom: -4px; }
  .mon.r5 .mon-shadow { background: radial-gradient(rgba(255,70,90,.95), rgba(255,170,0,.5) 45%, rgba(255,70,90,0) 70%); width: 96px; height: 26px; margin-left: -48px; bottom: -6px; animation: glow 1.2s ease-in-out infinite; }
  .mon.far { opacity: .62; filter: saturate(.55); }
  .mon .sparkle { position: absolute; z-index: 2; top: -4px; right: -8px; font-size: 18px; animation: twinkle 1.1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @keyframes glow { 50% { opacity: .55; } }
  @keyframes twinkle { 50% { transform: scale(.6) rotate(30deg); opacity: .5; } }

  .stop { width: 46px; height: 76px; cursor: pointer; }
  .stop .float { position: absolute; left: 50%; top: 6px; width: 26px; height: 26px; margin-left: -13px; animation: bob 2.4s ease-in-out infinite; perspective: 200px; }
  .cube { position: absolute; inset: 0; transform-style: preserve-3d; animation: cube 5s linear infinite; }
  .cube i { position: absolute; inset: 0; background: linear-gradient(135deg, #6fd3ff, #1565c0); border: 2px solid #c8eeff; border-radius: 4px; }
  .cube i:nth-child(1) { transform: translateZ(13px); } .cube i:nth-child(2) { transform: rotateY(180deg) translateZ(13px); }
  .cube i:nth-child(3) { transform: rotateY(90deg) translateZ(13px); } .cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(13px); }
  .cube i:nth-child(5) { transform: rotateX(90deg) translateZ(13px); } .cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(13px); }
  @keyframes cube { from { transform: rotateX(-22deg) rotateY(0); } to { transform: rotateX(-22deg) rotateY(360deg); } }
  .stop .pole { position: absolute; left: 50%; bottom: 6px; width: 5px; height: 38px; margin-left: -2.5px; border-radius: 3px; background: linear-gradient(90deg, #a7cdf5, #2a5d99); }
  .stop .base { position: absolute; left: 50%; bottom: 0; width: 34px; height: 12px; margin-left: -17px; border-radius: 50%;
    background: radial-gradient(#64b5f6, #0d47a1); box-shadow: 0 0 14px 5px rgba(30,136,229,.55); }

  /* ---------- Sheets ---------- */
  .screen { position: fixed; inset: 0; z-index: 1000; display: none; flex-direction: column; }
  .screen.on { display: flex; animation: slideUp .25s ease-out; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } }
  .sheet { background: radial-gradient(120% 60% at 50% 0%, #22366a, var(--bg) 60%); overflow-y: auto;
    padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .sheet-in { max-width: 720px; margin: 0 auto; width: 100%; }
  .sheet h2 { margin: 4px 0 14px; display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 24px; }
  .sheet h3 { font-weight: 900; margin: 22px 0 10px; font-size: 17px; }
  .close { background: rgba(255,255,255,.1); width: 42px; height: 42px; border-radius: 50%; font-size: 20px; flex: none; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; background: rgba(0,0,0,.25); border-radius: 14px; padding: 4px; }
  .tabs button { flex: 1; padding: 9px 4px; border-radius: 10px; color: var(--muted); font-weight: 800; font-size: 14px; }
  .tabs button.on { background: var(--blue); color: #fff; box-shadow: 0 3px 10px rgba(61,125,202,.5); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  .card { background: linear-gradient(160deg, #22365f, #18264a); border: 1px solid var(--line); border-radius: 16px; padding: 10px 6px 8px;
    text-align: center; position: relative; cursor: pointer; transition: transform .12s; overflow: hidden; }
  .card:active { transform: scale(.96); }
  .card .pic { height: 72px; display: grid; place-items: center; }
  .card .pic img { max-width: 80px; max-height: 72px; image-rendering: pixelated; }
  .card .n { font-size: 13px; font-weight: 800; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .s { font-size: 11px; color: var(--muted); }
  .card.unknown .pic img { filter: brightness(0) invert(1) opacity(.2); }
  .card .num { position: absolute; top: 6px; left: 8px; font-size: 10px; color: var(--muted); }
  .card .cp { position: absolute; top: 6px; left: 8px; font-size: 11px; font-weight: 900; color: #fff; }
  .card .badge { position: absolute; top: 6px; right: 8px; font-size: 11px; background: var(--accent); color: #222; border-radius: 999px; padding: 0 6px; font-weight: 900; }
  .card .marks { position: absolute; top: 4px; right: 6px; font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stats div { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .stats b { display: block; font-size: 19px; font-weight: 900; }
  .stats span { font-size: 11px; color: var(--muted); }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
  .toolbar input, .toolbar select { background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; min-width: 0; }
  .toolbar input { flex: 1; }
  .toolbar select option { background: var(--bg2); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .row .ic { font-size: 30px; width: 40px; text-align: center; flex: none; }
  .row .grow { flex: 1; min-width: 0; }
  .row small { color: var(--muted); display: block; }
  .row .cnt { font-weight: 900; font-size: 18px; }
  .btn { background: linear-gradient(#ffd93d, var(--accent)); color: #2a2100; font-weight: 900; padding: 12px 18px; border-radius: 14px;
    box-shadow: 0 4px 0 var(--accent-d), 0 8px 16px rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d); }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn.ghost { background: rgba(255,255,255,.12); color: var(--text); box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .btn.blue { background: linear-gradient(#5b9cf0, var(--blue)); color: #fff; box-shadow: 0 4px 0 #285a98, 0 8px 16px rgba(0,0,0,.25); }
  .btn.red { background: linear-gradient(#f16d71, var(--red)); color: #fff; box-shadow: 0 4px 0 #a52f33, 0 8px 16px rgba(0,0,0,.25); }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .type { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.3); }
  .empty-note { color: var(--muted); text-align: center; padding: 30px 10px; }

  /* Quests & medals */
  .quest { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .quest .qt { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .quest .prog { height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .quest .prog i { display: block; height: 100%; background: linear-gradient(90deg, #4ade80, var(--green)); }
  .quest small { color: var(--muted); }
  .quest.done { opacity: .55; }
  .medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .medal { display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .medal .mi { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; flex: none; background: #2a3a60; }
  .medal.t1 .mi { background: radial-gradient(circle at 35% 30%, #f3c79a, #b06b2c); }
  .medal.t2 .mi { background: radial-gradient(circle at 35% 30%, #fff, #a9b4c2); }
  .medal.t3 .mi { background: radial-gradient(circle at 35% 30%, #fff3a0, #e0a800); }
  .medal small { color: var(--muted); display: block; font-size: 11px; }
  .medal > div:last-child { min-width: 0; }
  .medal b { font-size: 13px; overflow-wrap: anywhere; }

  /* Settings */
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; background: rgba(255,255,255,.06);
    border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; }
  .set-row small { color: var(--muted); display: block; font-size: 12px; }
  .switch { width: 52px; height: 30px; border-radius: 15px; background: rgba(255,255,255,.18); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .switch.on { background: var(--green); }
  .switch.on::after { transform: translateX(22px); }
  .set-row.col { flex-direction: column; align-items: stretch; }
  .seg { display: flex; background: rgba(0,0,0,.3); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { flex: 1; padding: 7px 8px; border-radius: 8px; font-size: 13px; color: var(--muted); font-weight: 800; }
  .seg button.on { background: var(--blue); color: #fff; }

  /* Pokémon detail */
  .mon-detail { padding: 0; }
  .md-hero { position: relative; height: 330px; flex: none; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .md-hero .md-close { position: absolute; top: max(16px, env(safe-area-inset-top)); right: 16px; z-index: 3; }
  .md-hero .plat { position: absolute; bottom: 26px; left: 50%; width: 240px; height: 60px; margin-left: -120px; border-radius: 50%;
    background: radial-gradient(rgba(255,255,255,.45), rgba(255,255,255,.08) 60%, transparent 70%); }
  .md-hero img { position: relative; z-index: 2; width: 230px; height: 230px; object-fit: contain; margin-bottom: 40px; animation: floaty 3s ease-in-out infinite; filter: drop-shadow(0 18px 14px rgba(0,0,0,.35)); }
  .md-hero img.evolving { animation: evolve 2.2s ease-in-out; }
  @keyframes floaty { 50% { transform: translateY(-10px) rotate(-1.5deg); } }
  @keyframes evolve { 0% { filter: brightness(1); } 20%, 80% { filter: brightness(0) invert(1) drop-shadow(0 0 30px #fff); transform: scale(1.1); }
    40% { transform: scale(.7); } 60% { transform: scale(1.2); } 100% { filter: brightness(1); } }
  .md-body { padding: 18px 16px; max-width: 560px; width: 100%; margin: 0 auto; }
  .md-cp { text-align: center; font-size: 15px; color: var(--muted); }
  .md-cp b { font-size: 32px; color: #fff; font-weight: 900; }
  .md-name { text-align: center; font-size: 26px; font-weight: 900; margin: 2px 0 6px; }
  .md-types { text-align: center; margin-bottom: 14px; }
  .md-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .md-grid div { background: rgba(255,255,255,.07); border-radius: 12px; padding: 10px; text-align: center; }
  .md-grid b { display: block; font-size: 16px; }
  .md-grid span { font-size: 11px; color: var(--muted); }
  .md-actions { display: flex; flex-direction: column; gap: 10px; }
  .chain { display: flex; justify-content: center; align-items: center; gap: 4px; margin: 10px 0 18px; flex-wrap: wrap; }
  .chain img { width: 56px; height: 56px; image-rendering: pixelated; }
  .chain .unk { filter: brightness(0) invert(1) opacity(.25); }
  .chain span { color: var(--muted); }

  /* ---------- Encounter ---------- */
  #encounter { touch-action: none; user-select: none; overflow: hidden; background: #8fd3ff; }
  .sky { position: absolute; inset: 0; background: linear-gradient(#5fb7f5, #bfe6ff 55%); }
  .sun { position: absolute; top: 12%; right: 12%; width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(#fff9d6, #ffe36b 60%, rgba(255,227,107,0) 72%); }
  .cloud { position: absolute; height: 30px; border-radius: 30px; background: rgba(255,255,255,.9); filter: blur(1px); animation: drift linear infinite; }
  .cloud::before { content: ""; position: absolute; left: 20%; top: -18px; width: 50%; height: 40px; border-radius: 50%; background: inherit; }
  .cloud.c1 { top: 16%; width: 120px; animation-duration: 60s; left: -20%; }
  .cloud.c2 { top: 26%; width: 90px; animation-duration: 45s; left: 40%; opacity: .8; }
  .cloud.c3 { top: 8%; width: 70px; animation-duration: 75s; left: 70%; opacity: .7; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  .ground3d { position: absolute; left: 0; right: 0; top: 40%; bottom: 0; overflow: hidden; perspective: 320px;

    let x = r * pool.reduce((a, [, w]) => a + w, 0);
    for (const [s, w] of pool) { if ((x -= w) <= 0) return s; }
    return pool[0][0];
  }
  const cpFor = (sp, r) => Math.round(10 + r * 90 * sp.rarity + sp.rarity * 40 + levelFromXp(S.xp).lvl * 4);

  function generate() {
    const win = Math.floor(Date.now() / WINDOW_MS);
    const ci = Math.floor(pos[0] / CELL), cj = Math.floor(pos[1] / CELL);
    const mons = [], stops = [];
    for (let i = ci - VIEW_CELLS; i <= ci + VIEW_CELLS; i++) {
      for (let j = cj - VIEW_CELLS; j <= cj + VIEW_CELLS; j++) {
        const rs = rng(hash(`stop:${i}:${j}`));
        if (rs() < 0.22) stops.push({ id: `s${i}_${j}`, ll: [(i + rs()) * CELL, (j + rs()) * CELL] });
        const r = rng(hash(`mon:${i}:${j}:${win}`));
        const n = r() < 0.55 ? (r() < 0.25 ? 2 : 1) : 0;
        for (let k = 0; k < n; k++) {
          const id = `m${i}_${j}_${win}_${k}`;
          const sp = speciesPick(r());
          const ll = [(i + r()) * CELL, (j + r()) * CELL];
          const cp = cpFor(sp, r());
          const shiny = r() < SHINY_CHANCE;
          if (!S.gone[id]) mons.push({ id, sp, ll, cp, shiny });
        }
      }
    }
    return { mons, stops };
  }

  let incenseSpawns = [], lastIncense = 0;
  function incenseTick() {
    const left = S.incenseUntil - Date.now();
    $('incenseChip').classList.toggle('on', left > 0);
    if (left <= 0) return;
    const s = Math.ceil(left / 1000);
    $('incenseTime').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    if (pos && Date.now() - lastIncense > 40000) {
      lastIncense = Date.now();
      const r = Math.random, a = r() * Math.PI * 2, d = 20 + r() * 40;
      const sp = speciesPick(r());
      incenseSpawns.push({ id: 'i' + Date.now(), sp, cp: cpFor(sp, r()), shiny: r() < SHINY_CHANCE * 2, exp: Date.now() + 5 * 60000,
        ll: [pos[0] + (d * Math.cos(a)) / 111320, pos[1] + (d * Math.sin(a)) / (111320 * Math.cos(pos[0] * Math.PI / 180))] });
      refreshWorld();
      toast(`🪔 Ладан приманил покемона!`, 1300);
    }
  }
  setInterval(incenseTick, 1000);

  const markers = new Map();
  function refreshWorld() {
    if (!pos) return;
    const now = Date.now();
    const { mons, stops } = generate();
    incenseSpawns = incenseSpawns.filter((m) => m.exp > now && !S.gone[m.id]);
    const want = new Map();
    mons.concat(incenseSpawns).forEach((m) => want.set(m.id, { kind: 'mon', data: m }));
    stops.forEach((s) => { const t = S.stops[s.id]; if (!(t && now - t < STOP_COOLDOWN)) want.set(s.id, { kind: 'stop', data: s }); });

    markers.forEach((v, id) => { if (!want.has(id)) { v.marker.remove(); markers.delete(id); } });
    want.forEach((v, id) => { if (!markers.has(id)) createMarker(id, v); });

    const nearby = [];
    markers.forEach((v) => {
      if (v.kind !== 'mon') return;
      const d = dist(pos, v.data.ll), close = d <= CATCH_RADIUS;
      if (v.close !== close) { v.close = close; v.el.classList.toggle('far', !close); }
      if (d < 400) nearby.push({ m: v.data, d });
    });
    nearby.sort((a, b) => a.d - b.d);
    renderRadar(nearby.slice(0, 10));
    const nearCount = nearby.filter((x) => x.d <= CATCH_RADIUS).length;
    $('status').textContent = (demo ? 'Демо · ' : '') + (nearCount ? `Можно поймать: ${nearCount}` : nearby.length ? 'Подойди к покемону поближе' : 'Гуляй, чтобы найти покемонов');
    cleanup();
  }
  function createMarker(id, v) {
    const el = document.createElement('div');
    if (v.kind === 'mon') {
      const m = v.data;
      el.className = `mon r${m.sp.rarity} far`;
      el.innerHTML = `<div class="mon-shadow"></div>${sprImg(m.sp.id, m.shiny)}${m.shiny ? '<span class="sparkle">✨</span>' : ''}`;
      el.addEventListener('click', (e) => { e.stopPropagation(); tryEncounter(m); });
    } else {
      el.className = 'stop';
      el.innerHTML = '<div class="float"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div class="pole"></div><div class="base"></div>';
      el.addEventListener('click', (e) => { e.stopPropagation(); useStop(v.data, e); });
    }
    const marker = new maplibregl.Marker({ element: el, anchor: 'bottom' }).setLngLat([v.data.ll[1], v.data.ll[0]]).addTo(map);
    markers.set(id, { marker, el, kind: v.kind, data: v.data, close: false });
  }
  function rebuildMarkers() { markers.forEach((v) => v.marker.remove()); markers.clear(); refreshWorld(); }
  function cleanup() {
    const win = Math.floor(Date.now() / WINDOW_MS), now = Date.now(); let changed = false;
    for (const id in S.gone) if (S.gone[id] < win - 1) { delete S.gone[id]; changed = true; }
    for (const id in S.stops) if (now - S.stops[id] > STOP_COOLDOWN) { delete S.stops[id]; changed = true; }
    if (changed) save();
  }
  setInterval(refreshWorld, 10000);

  let radarSig = '';
  function renderRadar(list) {
    const el = $('radar');
    el.classList.toggle('hidden', !S.settings.radar);
    const sig = list.map((x) => x.m.id + Math.round(x.d / 10)).join('|');
    if (sig === radarSig && el.innerHTML) return;
    radarSig = sig;
    el.innerHTML = '<span class="lbl">РЯДОМ</span>' + (list.length ? list.map((x) =>
      `<button class="rad-item ${x.d <= CATCH_RADIUS ? 'near' : ''} ${x.m.shiny ? 'shiny' : ''}" data-id="${x.m.id}">
        <img src="${pixelUrl(x.m.sp.id, x.m.shiny)}" alt="">${fmtDist(x.d)}</button>`).join('')
      : '<span class="empty">Поблизости никого. Иди искать! 🚶</span>');
  }
  $('radar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    const v = markers.get(b.dataset.id); if (!v) return;
    if (dist(pos, v.data.ll) <= CATCH_RADIUS) return tryEncounter(v.data);
    follow = false;
    map.easeTo({ center: [v.data.ll[1], v.data.ll[0]], duration: 700 });
    toast(`${v.data.sp.name}<br><small>${fmtDist(dist(pos, v.data.ll))} — иди туда!</small>`);
  });

  // ================= POKÉSTOPS =================
  function useStop(s, ev) {
    const d = dist(pos, s.ll);
    if (d > STOP_RADIUS) { SFX.tap(); return toast(`🎁 Подойди ближе<br><small>${fmtDist(d)}</small>`); }
    const r = Math.random;
    const parts = grant({
      basic: 3 + Math.floor(r() * 3),
      great: r() < 0.4 ? 1 + Math.floor(r() * 2) : 0,
      ultra: r() < 0.1 ? 1 : 0,
      berry: r() < 0.35 ? 1 + Math.floor(r() * 2) : 0,
      incense: r() < 0.03 ? 1 : 0,
    });
    S.stops[s.id] = Date.now(); S.spins++; save();
    SFX.spin(); vibrate(40);
    if (ev) burst(ev.clientX, ev.clientY, ['🔴', '🔵', '✨', '🍓'], 12);
    quest('spin');
    addXp(50);
    refreshWorld();
    toast(`🎁 Покестоп!<br>${parts.join('  ')}<br><small>+50 XP</small>`, 2200);

  // ================= ENCOUNTER =================
  let enc = null;
  const totalBalls = () => S.balls.basic + S.balls.great + S.balls.ultra;
  function tryEncounter(mon) {
    const d = dist(pos, mon.ll);
    if (d > CATCH_RADIUS) { SFX.tap(); return toast(`<img src="${pixelUrl(mon.sp.id, mon.shiny)}" alt="">${mon.sp.name} далеко<br><small>${fmtDist(d)} — подойди ближе</small>`); }
    if (!totalBalls()) return toast('Нет покеболов!<br><small>Загляни на покестоп 🎁</small>');
    startEncounter(mon);
  }
  function startEncounter(mon) {
    S.seen[mon.sp.id] = true; save();
    enc = { mon, ball: S.balls.basic ? 'basic' : S.balls.great ? 'great' : 'ultra', busy: false, ringT: 0, x: 0, dir: 1, raf: 0, fails: 0, berry: false };
    $('encounter').classList.toggle('night', isNight());
    $('encName').textContent = (mon.shiny ? '✨ ' : '') + mon.sp.name;
    $('encCp').textContent = 'CP ' + mon.cp;
    $('encInfo').innerHTML = `${typeChip(mon.sp.type)} <span style="color:${RARITY[mon.sp.rarity].color};font-size:12px;font-weight:800">● ${RARITY[mon.sp.rarity].label}</span>`;
    const body = $('encBody'); body.className = 'body';
    const anim = S.settings.sprites === 'anim';
    body.innerHTML = anim
      ? `<img class="anim" src="${spriteUrl(mon.sp.id, mon.shiny, 'anim')}" alt="" draggable="false">`
      : `<img class="art" src="${artUrl(mon.sp.id, mon.shiny)}" alt="" draggable="false">`;
    const im = body.querySelector('img');
    if (anim) {
      im.onload = () => { const k = Math.min(3, 170 / im.naturalHeight, 220 / im.naturalWidth); im.style.width = im.naturalWidth * k + 'px'; im.style.height = im.naturalHeight * k + 'px'; };
      im.onerror = () => { im.onerror = null; im.className = 'art'; im.src = artUrl(mon.sp.id, mon.shiny); };
    }
    $('encHint').textContent = 'Смахни покебол вверх. Бросай, когда цветное кольцо маленькое!';
    resetBall(); renderPicker();
    $('encounter').classList.add('on');
    SFX.appear(); vibrate(30);
    if (mon.shiny) setTimeout(() => burst(innerWidth / 2, innerHeight * 0.32, ['✨', '⭐'], 16), 300);
    loop();
  }
  function renderPicker() {
    $('encPicker').innerHTML = Object.keys(BALLS).map((k) =>
      `<button class="pick ${enc.ball === k ? 'on' : ''}" data-ball="${k}" ${S.balls[k] ? '' : 'disabled'}>${BALLS[k].icon} ${S.balls[k]}</button>`).join('')
      + `<button class="pick berry ${enc.berry ? 'on' : ''}" id="berryBtn" ${S.items.berry && !enc.berry ? '' : 'disabled'}>🍓 ${S.items.berry}</button>`;
    $('ball').className = 'ball ' + BALLS[enc.ball].css;
  }
  $('encPicker').addEventListener('click', (e) => {
    if (!enc || enc.busy) return;
    const b = e.target.closest('[data-ball]');
    if (b && S.balls[b.dataset.ball]) { enc.ball = b.dataset.ball; SFX.tap(); renderPicker(); return; }
    if (e.target.closest('#berryBtn') && S.items.berry && !enc.berry) {
      S.items.berry--; enc.berry = true; save();
      const be = document.createElement('div'); be.className = 'berry-eat'; be.textContent = '🍓';
      $('target').appendChild(be); setTimeout(() => be.remove(), 1000);
      SFX.berry(); quest('berry'); renderPicker();
      toast(`${enc.mon.sp.name} съел ягоду!`, 1100);
    }
  });

  function loop() {
    if (!enc) return;
    const ring = $('ring');
    if (!enc.busy) {
      enc.ringT = (enc.ringT + 0.011 + enc.mon.sp.rarity * 0.001) % 1;
      const max = Math.min(110, innerWidth / 2 - 100), speed = 0.5 + enc.mon.sp.rarity * 0.35;
      enc.x += enc.dir * speed;
      if (Math.abs(enc.x) > max) { enc.dir *= -1; enc.x = Math.sign(enc.x) * max; }
      if (Math.random() < 0.002 * enc.mon.sp.rarity) { const b = $('encBody'); b.classList.add('attack'); setTimeout(() => b.classList.remove('attack'), 500); }
    }
    const size = 170 - 135 * Math.sin(enc.ringT * Math.PI);
    ring.style.width = ring.style.height = size + 'px';
    ring.style.borderColor = RARITY[enc.mon.sp.rarity].color;
    ring.style.boxShadow = `0 0 12px ${RARITY[enc.mon.sp.rarity].color}`;
    $('target').style.transform = `translateX(${enc.x}px)`;
    enc.ringSize = size;
    enc.raf = requestAnimationFrame(loop);
  }
  function endEncounter() {
    if (!enc) return;
    cancelAnimationFrame(enc.raf); enc = null;
    $('encounter').classList.remove('on');
    refreshWorld();
  }
  $('encRun').addEventListener('click', () => { SFX.tap(); endEncounter(); });

  const ball = $('ball');
  let drag = null;
  function resetBall() {
    ball.getAnimations().forEach((a) => a.cancel());
    ball.style.transition = 'none'; ball.style.transform = ''; ball.style.opacity = 1;
  }
  ball.addEventListener('pointerdown', (e) => {
    if (!enc || enc.busy) return;
    ball.setPointerCapture(e.pointerId);
    drag = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, pts: [] };
    ball.style.transition = 'none';
  });
  ball.addEventListener('pointermove', (e) => {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY;
    drag.pts.push([e.clientX, e.clientY]); if (drag.pts.length > 6) drag.pts.shift();
    ball.style.transform = `translate(${e.clientX - drag.x0}px, ${e.clientY - drag.y0}px)`;
  });
  const releaseBall = () => {
    if (!drag) return;
    const d = drag; drag = null;
    const p0 = d.pts[0] || [d.x0, d.y0];
    const dy = d.y - p0[1], dx = d.x - p0[0];
    if (d.y0 - d.y < 60 || dy > -10) { ball.style.transition = 'transform .25s'; ball.style.transform = ''; return; }
    throwBall(dx / Math.max(1, -dy));
  };
  ball.addEventListener('pointerup', releaseBall);
  ball.addEventListener('pointercancel', releaseBall);

  function throwBall(slope) {
    if (S.balls[enc.ball] <= 0) return toast('Закончились такие покеболы');
    enc.busy = true;
    S.balls[enc.ball]--; save(); renderHud(); renderPicker();
    SFX.throw();

    const tgt = $('target').getBoundingClientRect(), br = ball.getBoundingClientRect();
    const sx = br.left + br.width / 2, sy = br.top + br.height / 2;
    const tx = tgt.left + tgt.width / 2, ty = tgt.top + tgt.height / 2;
    const landX = sx + slope * (sy - ty);
    const hit = Math.abs(landX - tx) < 65;
    const ringSize = enc.ringSize;
    const ex = hit ? tx : landX, ey = hit ? ty : ty - 50;
    ball.style.transition = 'transform .55s cubic-bezier(.3,.7,.4,1)';
    ball.style.transform = `translate(${ex - sx}px, ${ey - sy}px) scale(.45) rotate(720deg)`;

    setTimeout(() => {
      if (!enc) return;
      if (!hit) {
        ball.style.opacity = 0; SFX.miss(); toast('Мимо!', 800);
        setTimeout(() => { if (enc) { resetBall(); enc.busy = false; afterThrow(); } }, 500);
        return;
      }
      SFX.hit(); vibrate(25);
      let bonus = 1.1, label = 'Неплохо', bxp = 0;
      if (ringSize < 65) { bonus = 1.85; label = 'Отлично!'; bxp = 100; quest('excellent'); }
      else if (ringSize < 110) { bonus = 1.4; label = 'Хорошо!'; bxp = 50; }
      enc.bonusXp = Math.max(enc.bonusXp || 0, bxp);
      const chance = Math.min(0.97, RARITY[enc.mon.sp.rarity].catchRate * BALLS[enc.ball].mult * bonus * (enc.berry ? 1.5 : 1) * (1 + enc.fails * 0.08));
      const success = Math.random() < chance;
      enc.berry = false;
      toast(label, 700);
      $('encBody').style.visibility = 'hidden';
      ball.style.transition = 'transform .3s';
      ball.style.transform = `translate(${tx - sx}px, ${ty - sy + 60}px) scale(.6)`;
      const wobbles = success ? 3 : 1 + Math.floor(Math.random() * 3);
      let w = 0;
      const step = () => {
        if (!enc) return;
        if (w++ >= wobbles) return finishThrow(success, tx, ty + 60);
        SFX.wobble(); vibrate(15);
        ball.animate([{ rotate: '0deg' }, { rotate: '-28deg' }, { rotate: '28deg' }, { rotate: '0deg' }], { duration: 500, composite: 'add' });
        setTimeout(step, 750);
      };
      setTimeout(step, 500);
    }, 560);
  }
  function afterThrow() {
    if (!totalBalls()) { toast('Покеболы закончились', 1400); setTimeout(endEncounter, 1200); return; }
    if (!S.balls[enc.ball]) enc.ball = S.balls.basic ? 'basic' : S.balls.great ? 'great' : 'ultra';
    renderPicker();
  }
  function finishThrow(success, bx, by) {
    const mon = enc.mon;
    if (success) {
      const sp = mon.sp, first = !S.caught[sp.id], fam = family(sp.id), day = today();
      const firstToday = S.lastCatchDay !== day;
      S.caught[sp.id] = (S.caught[sp.id] || 0) + 1;
      S.totalCaught++; S.lastCatchDay = day;
      if (mon.shiny) S.shinyCaught++;
      S.candy[fam] = (S.candy[fam] || 0) + 3 + (sp.rarity >= 4 ? 7 : 0);
      S.mons.unshift({ uid: S.uid++, sp: sp.id, cp: mon.cp, t: Date.now(), shiny: mon.shiny, fav: false });
      if (S.mons.length > 1000) S.mons.length = 1000;
      S.gone[mon.id] = Math.floor(Date.now() / WINDOW_MS);
      const xp = RARITY[sp.rarity].xp + (enc.bonusXp || 0) + (first ? 500 : 0) + (mon.shiny ? 500 : 0) + (firstToday ? 1000 : 0);
      save();
      SFX.catch(); vibrate([40, 60, 80]);
      burst(bx, by, ['⭐', '✨', '💫'], 16);
      quest('catch'); quest('type', 1, sp.type);
      setTimeout(() => {
        cancelAnimationFrame(enc.raf); enc = null;
        $('encounter').classList.remove('on');
        const lines = [`+${xp} XP`, `🍬 +${3 + (sp.rarity >= 4 ? 7 : 0)}`];
        if (first) lines.push('🆕 Новый вид!');
        if (firstToday) lines.push('☀️ Первая поимка дня');
        popup(`<img class="art" src="${artUrl(sp.id, mon.shiny)}" alt=""><h2>${mon.shiny ? '✨ ' : ''}${sp.name} пойман!</h2>
          <div>${typeChip(sp.type)} <b>CP ${mon.cp}</b></div>
          <div class="rewards">${lines.map((l) => `<span>${l}</span>`).join('')}</div>
          <button class="btn" data-ok>Отлично!</button>`);
        addXp(xp);
        refreshWorld();
      }, 700);
      return;
    }
    $('encBody').style.visibility = 'visible';
    enc.fails++;
    if (Math.random() < RARITY[mon.sp.rarity].flee + enc.fails * 0.03) {
      S.gone[mon.id] = Math.floor(Date.now() / WINDOW_MS); save();
      ball.style.opacity = 0;
      $('encBody').classList.add('flee');
      SFX.flee(); vibrate(120);
      toast(`${mon.sp.name} убежал…`, 1500);
      setTimeout(endEncounter, 1300);
      return;
    }
    SFX.miss(); toast('Вырвался!', 900);
    resetBall(); enc.busy = false;
    afterThrow();
  }

  // ================= COLLECTION =================

  }
  $('dexTabs').addEventListener('click', (e) => { if (e.target.dataset.tab) { dexTab = e.target.dataset.tab; SFX.tap(); renderDex(); } });
  $('dexBody').addEventListener('click', (e) => {
    const c = e.target.closest('[data-uid]'); if (c) return openMon(+c.dataset.uid);
    const d = e.target.closest('[data-sp]'); if (d && (S.caught[d.dataset.sp] || S.seen[d.dataset.sp])) speciesInfo(+d.dataset.sp);
  });

  function chainHtml(id) {
    const ch = chainOf(id);
    if (ch.length < 2) return '';
    return '<div class="chain">' + ch.map((c, i) =>
      (i && ch[i - 1].depth < c.depth ? '<span>›</span>' : i ? '<span>·</span>' : '') +
      `<img class="${S.caught[c.id] ? '' : 'unk'}" src="${pixelUrl(c.id)}" alt="" title="${S.caught[c.id] ? SP(c.id).name : '???'}">`).join('') + '</div>';
  }
  function speciesInfo(id) {
    const s = SP(id), c = S.caught[id] || 0;
    popup(`<img class="art" src="${artUrl(id)}" alt="" style="${c ? '' : 'filter:brightness(0) invert(1) opacity(.3)'}">
      <h2>#${String(id).padStart(3, '0')} ${s.name}</h2><div>${typeChip(s.type)} <span style="color:${RARITY[s.rarity].color}">● ${RARITY[s.rarity].label}</span></div>
      <p>Поймано: ${c} · Конфеты: 🍬 ${S.candy[family(id)] || 0}</p>${chainHtml(id)}<button class="btn" data-ok>Закрыть</button>`);
  }

  function openMon(uid) {
    const m = S.mons.find((x) => x.uid === uid); if (!m) return;
    const s = SP(m.sp), fam = family(m.sp), candy = S.candy[fam] || 0, evo = EVOLVES[m.sp];
    const col = TYPE_COLORS[s.type] || '#555';
    const sheet = $('monSheet');
    sheet.innerHTML = `
      <div class="md-hero" style="background: radial-gradient(90% 90% at 50% 100%, ${col}, #101a33 75%)">
        <button class="close md-close" id="mdClose">✕</button>
        <div class="plat"></div>
        <img id="mdArt" src="${artUrl(s.id, m.shiny)}" alt="">
      </div>
      <div class="md-body">
        <div class="md-cp">CP <b>${m.cp}</b></div>
        <div class="md-name">${m.shiny ? '✨ ' : ''}${s.name}</div>
        <div class="md-types">${typeChip(s.type)} <span style="color:${RARITY[s.rarity].color};font-size:13px">● ${RARITY[s.rarity].label}</span></div>
        <div class="md-grid">
          <div><b>#${String(s.id).padStart(3, '0')}</b><span>номер</span></div>
          <div><b>🍬 ${candy}</b><span>конфет</span></div>
          <div><b>${new Date(m.t).toLocaleDateString('ru-RU')}</b><span>пойман</span></div>
        </div>
        ${chainHtml(s.id)}
        <div class="md-actions">
          ${evo ? `<button class="btn blue" id="mdEvolve" ${candy >= evo[0].cost ? '' : 'disabled'}>🧬 Эволюция · 🍬 ${evo[0].cost}${evo.length > 1 ? ' (случайно)' : ''}</button>` : ''}
          <button class="btn ghost" id="mdFav">${m.fav ? '💔 Убрать из избранного' : '❤️ В избранное'}</button>
          <button class="btn red" id="mdTransfer">👋 Отпустить (+1 🍬)</button>
        </div>
      </div>`;
    sheet.classList.add('on'); sheet.scrollTop = 0;
    $('mdClose').onclick = () => { sheet.classList.remove('on'); renderDex(); };
    $('mdFav').onclick = () => { m.fav = !m.fav; save(); SFX.tap(); openMon(uid); };
    let armed = false;
    $('mdTransfer').onclick = (e) => {
      if (m.fav) return toast('Сначала убери из избранного');
      if (!armed) { armed = true; e.target.textContent = 'Точно отпустить? Нажми ещё раз'; setTimeout(() => { armed = false; if (e.target.isConnected) e.target.textContent = '👋 Отпустить (+1 🍬)'; }, 2500); return; }
      S.mons = S.mons.filter((x) => x.uid !== uid); S.candy[fam] = candy + 1; save();
      SFX.tap(); sheet.classList.remove('on'); renderDex();
      toast(`Пока, ${s.name}! 👋<br><small>+1 🍬</small>`);
    };
    if (evo) $('mdEvolve').onclick = () => {
      const opt = evo[Math.floor(Math.random() * evo.length)];
      if ((S.candy[fam] || 0) < opt.cost) return;
      S.candy[fam] -= opt.cost;
      const to = SP(opt.to);
      $('mdArt').classList.add('evolving'); SFX.evolve(); vibrate([50, 80, 50, 80, 150]);
      $('mdEvolve').disabled = true;
      setTimeout(() => { $('mdArt').src = artUrl(to.id, m.shiny); }, 1100);
      setTimeout(() => {
        const r = $('mdArt').getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2, ['✨', '⭐', '💫'], 18);
        m.sp = to.id; m.cp = Math.round(m.cp * (1.5 + Math.random() * 0.4));
        S.caught[to.id] = (S.caught[to.id] || 0) + 1; S.seen[to.id] = true; S.evolved++; save();
        quest('evolve');
        toast(`🎉 ${s.name} эволюционировал в ${to.name}!`, 2400);
        addXp(500);
        openMon(uid);
      }, 2300);
    };
  }

  // ================= BAG =================
  function renderBag() {
    const active = S.incenseUntil > Date.now();
    $('bagBody').innerHTML = '<div class="list">' +
      Object.keys(BALLS).map((k) => `<div class="row"><div class="ic">${BALLS[k].icon}</div><div class="grow"><b>${BALLS[k].name}</b><small>${BALLS[k].desc}</small></div><span class="cnt">×${S.balls[k]}</span></div>`).join('') +
      `<div class="row"><div class="ic">${ITEMS.berry.icon}</div><div class="grow"><b>${ITEMS.berry.name}</b><small>${ITEMS.berry.desc}</small></div><span class="cnt">×${S.items.berry}</span></div>` +
      `<div class="row"><div class="ic">${ITEMS.incense.icon}</div><div class="grow"><b>${ITEMS.incense.name} ×${S.items.incense}</b><small>${ITEMS.incense.desc}</small></div>
        <button class="btn sm" id="useIncense" ${S.items.incense && !active ? '' : 'disabled'}>${active ? 'Активен' : 'Зажечь'}</button></div>` +
      '</div><h3>Конфеты</h3>' +
      (Object.keys(S.candy).length ? '<div class="list">' + Object.keys(S.candy).sort((a, b) => a - b).map((f) =>
        `<div class="row"><img src="${pixelUrl(f)}" alt="" style="width:48px;height:48px;image-rendering:pixelated"><div class="grow"><b>Конфеты: ${SP(+f).name}</b><small>Для эволюции этой семьи</small></div><span class="cnt">🍬 ${S.candy[f]}</span></div>`).join('') + '</div>'
        : '<div class="empty-note">Лови покемонов, чтобы получать конфеты для эволюции.</div>');
    const b = $('useIncense');
    if (b) b.onclick = () => {
      S.items.incense--; S.incenseUntil = Date.now() + INCENSE_MS; lastIncense = 0; save();
      SFX.spin(); toast('🪔 Ладан зажжён на 15 минут!'); renderBag(); incenseTick();
    };
  }

  // ================= PROFILE =================
  function renderProfile() {
    ensureQuests();
    const { lvl, rest, need } = levelFromXp(S.xp);
    const qs = S.quests.list.map((q, i) => {
      const goal = questGoal(q), done = q.p >= goal, t = QT[q.k];
      const prog = q.k === 'walk' ? `${(q.p / 1000).toFixed(2)} / ${q.n} км` : `${Math.floor(q.p)} / ${q.n}`;
      const rew = Object.keys(t.reward).map((k) => `${(BALLS[k] || ITEMS[k]).icon}×${t.reward[k]}`).join(' ');
      return `<div class="quest ${q.claimed ? 'done' : ''}"><div class="qt"><div><b>${t.text(q)}</b><br><small>${prog} · награда: ${rew} +500 XP</small></div>
        ${q.claimed ? '✅' : done ? `<button class="btn sm" data-claim="${i}">Забрать</button>` : ''}</div>
        <div class="prog"><i style="width:${Math.min(100, q.p / goal * 100)}%"></i></div></div>`;
    }).join('');
    const medals = MEDALS.map((m) => {
      const v = m.val(), tier = m.tiers.filter((t) => v >= t).length, next = m.tiers[tier];
      return `<div class="medal t${tier}"><div class="mi">${m.icon}</div><div><b>${m.name}</b>
        <small>${(Math.floor(v * 10) / 10).toLocaleString('ru-RU')} ${m.unit}${next ? ` · до след.: ${next}` : ' · максимум!'}</small></div></div>`;
    }).join('');
    $('profileBody').innerHTML = `
      <div class="stats">
        <div><b>${lvl}</b><span>уровень</span></div>
        <div><b>${S.xp.toLocaleString('ru-RU')}</b><span>всего XP</span></div>
        <div><b>${Math.round(rest / need * 100)}%</b><span>до ур. ${lvl + 1}</span></div>
        <div><b>${S.totalCaught}</b><span>поймано</span></div>
        <div><b>${(S.walked / 1000).toFixed(2)}</b><span>км пройдено</span></div>
        <div><b>${S.spins}</b><span>покестопов</span></div>
      </div>
      <h3>📜 Задания на сегодня</h3>${qs}
      <p style="color:var(--muted);font-size:13px">☀️ Первая поимка каждого дня даёт +1000 XP. Новые задания появляются каждый день.</p>
      <h3>🏅 Медали</h3><div class="medals">${medals}</div>`;
  }
  $('profileBody').addEventListener('click', (e) => {
    const b = e.target.closest('[data-claim]'); if (!b) return;
    const q = S.quests.list[+b.dataset.claim]; if (q.claimed) return;
    q.claimed = true;
    const parts = grant(QT[q.k].reward);
    const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top, ['🎁', '✨', '⭐'], 12);
    SFX.catch(); toast(`Награда!<br>${parts.join('  ')}<br><small>+500 XP</small>`, 2000);
    addXp(500); renderQuestDot(); renderProfile();
  });

  // ================= SETTINGS =================
  function renderSettings() {
    const sw = (k, title, sub) => `<div class="set-row"><div><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div><button class="switch ${S.settings[k] ? 'on' : ''}" data-sw="${k}"></button></div>`;
    const seg = (k, title, opts) => `<div class="set-row col"><div><b>${title}</b></div><div class="seg">${opts.map(([v, l]) =>
      `<button class="${S.settings[k] === v ? 'on' : ''}" data-seg="${k}" data-v="${v}">${l}</button>`).join('')}</div></div>`;
    $('settingsBody').innerHTML =
      '<h3>Карта</h3>' +
      seg('mapStyle', 'Стиль карты', [['auto', 'Авто'], ['day', 'День'], ['night', 'Ночь'], ['light', 'Светлая']]) +
      sw('buildings', '3D-здания', 'Объёмные дома на карте') +
      sw('tilt', 'Наклон камеры', '3D-вид сверху под углом') +
      sw('radius', 'Радиус ловли', 'Синий круг вокруг тебя') +
      sw('radar', 'Радар «Рядом»', 'Список ближайших покемонов') +
      '<h3>Игра</h3>' +
      seg('sprites', 'Покемоны', [['anim', 'Анимированные'], ['pixel', 'Пиксельные']]) +
      sw('sound', 'Звуки') +
      sw('vibro', 'Вибрация', 'Работает на Android') +
      `<div class="set-row"><div><b>Режим</b><small>${demo ? 'Демо: ходи стрелками' : 'GPS: настоящая прогулка'}</small></div>
        <div class="seg"><button class="${demo ? '' : 'on'}" id="modeGps">GPS</button><button class="${demo ? 'on' : ''}" id="modeDemo">Демо</button></div></div>` +
      '<h3>Данные</h3>' +
      `<div class="set-row"><div><b>Сбросить прогресс</b><small>Удалит всех покемонов, уровень и предметы</small></div><button class="btn sm red" id="resetBtn">Сбросить</button></div>` +
      `<p style="color:var(--muted);font-size:12px;text-align:center;margin-top:20px">Покемон GO · фанатская игра. Pokémon © Nintendo / Game Freak.<br>Карта © OpenFreeMap, OpenStreetMap. Спрайты: PokéAPI.</p>`;
  }
  $('settingsBody').addEventListener('click', (e) => {
    const t = e.target;
    if (t.dataset.sw) { const k = t.dataset.sw; S.settings[k] = !S.settings[k]; save(); SFX.tap(); applySetting(k); renderSettings(); return; }
    if (t.dataset.seg) { const k = t.dataset.seg; S.settings[k] = t.dataset.v; save(); SFX.tap(); applySetting(k); renderSettings(); return; }
    if (t.id === 'modeGps' && demo) { startGps(); renderSettings(); }
    if (t.id === 'modeDemo' && !demo) { $('settings').classList.remove('on'); startDemo(); }
    if (t.id === 'resetBtn') {
      if (t.dataset.armed) {
        const keep = S.settings; S = defaultState(); S.settings = keep; save();
        renderHud(); renderQuestDot(); incenseSpawns = []; rebuildMarkers(); renderSettings(); toast('Прогресс сброшен');
      } else { t.dataset.armed = 1; t.textContent = 'Точно?'; }
    }
  });
  function applySetting(k) {
    if (k === 'mapStyle') applyMapStyle();
    if (k === 'buildings') applyBuildings();
    if (k === 'tilt') map.easeTo({ pitch: S.settings.tilt ? PITCH : 0, duration: 600 });
    if (k === 'radius') updateRange();
    if (k === 'radar') { radarSig = ''; refreshWorld(); }
    if (k === 'sprites') rebuildMarkers();
    if (k === 'sound' && S.settings.sound) SFX.tap();
    if (k === 'vibro') vibrate(50);
  }

  // ================= NAV =================
  const openSheet = (id, render) => { SFX.tap(); render(); $(id).classList.add('on'); $(id).scrollTop = 0; };
  $('btnDex').addEventListener('click', () => openSheet('dex', renderDex));
  $('btnBag').addEventListener('click', () => openSheet('bag', renderBag));
  $('btnProfile').addEventListener('click', () => openSheet('profile', renderProfile));
  $('btnProfile2').addEventListener('click', () => openSheet('profile', renderProfile));
  $('btnSettings').addEventListener('click', () => openSheet('settings', renderSettings));
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => { SFX.tap(); $(b.dataset.close).classList.remove('on'); }));
  $('btnCenter').addEventListener('click', () => {
    SFX.tap(); follow = true;
    if (pos) map.easeTo({ center: [pos[1], pos[0]], zoom: 16.3, pitch: S.settings.tilt ? PITCH : 0, duration: 700 });
  });
  $('btnCompass').addEventListener('click', () => { SFX.tap(); map.easeTo({ bearing: 0, duration: 600 }); });

  // ================= LOCATION =================
  let watchId = null;
  function startGps() {
    if (!('geolocation' in navigator)) return startDemo('Геолокация не поддерживается');
    demo = false; $('dpad').classList.remove('on');
    $('status').textContent = 'Поиск геолокации…';
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    let got = false;
    watchId = navigator.geolocation.watchPosition(
      (p) => {
        if (demo) return;
        const ll = [p.coords.latitude, p.coords.longitude];
        if (!got) { got = true; follow = true; lastPos = null; setPos(ll, true); return; }
        setPos(ll);
      },
      (err) => { if (!got) startDemo(err.code === 1 ? 'Доступ к геолокации запрещён' : 'Не удалось определить местоположение'); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
    );
  }
  function startDemo(reason) {
    demo = true;
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    $('dpad').classList.add('on');
    follow = true;
    setPos(pos || DEFAULT_POS, true);
    popup(`<div class="big">🗺️</div><h2>Демо-режим</h2>
      <p>${reason ? reason + '. ' : ''}Ходи стрелками на экране или клавишами WASD / ↑↓←→. Двойной тап по карте — телепорт.</p>
      <button class="btn" data-ok>Поехали!</button>`);
  }
  const STEP = 0.00012; // ~13 m
  function move(dx, dy) {
    if (!demo || !pos) return;
    // move relative to the camera direction
    const b = map.getBearing() * Math.PI / 180;
    const east = dx * Math.cos(b) + dy * Math.sin(b), north = -dx * Math.sin(b) + dy * Math.cos(b);
    follow = true;
    setPos([pos[0] + north * STEP, pos[1] + east * STEP / Math.cos(pos[0] * Math.PI / 180)]);
  }
  let holdTimer;
  document.querySelectorAll('#dpad button').forEach((b) => {
    const [dx, dy] = b.dataset.d.split(',').map(Number);
    const start = (e) => { e.preventDefault(); move(dx, dy); clearInterval(holdTimer); holdTimer = setInterval(() => move(dx, dy), 140); };
    const stop = () => clearInterval(holdTimer);
    b.addEventListener('pointerdown', start); b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
  });
  const KEYS = { ArrowUp: [0, 1], KeyW: [0, 1], ArrowDown: [0, -1], KeyS: [0, -1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
  window.addEventListener('keydown', (e) => {
    if (!KEYS[e.code] || enc || document.querySelector('.screen.on') || e.target.tagName === 'INPUT') return;
    e.preventDefault(); move(...KEYS[e.code]);
  });
  map.on('dblclick', (e) => { if (demo) { follow = true; setPos([e.lngLat.lat, e.lngLat.lng]); } });

  // ================= START =================
  renderHud();
  ensureQuests();
  renderQuestDot();
  incenseTick();
  startGps();
})();
</script>
</body>
</html>
