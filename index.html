<meta name="theme-color" content="#1b2a4a">
<title>Покемон GO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0f1a30;
    --panel: rgba(18, 28, 52, 0.92);
    --text: #f3f6ff;
    --muted: #9fb0d3;
    --accent: #ffcb05;
    --accent2: #3d7dca;
    --danger: #e5484d;
    --ok: #30a46c;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  #map { position: fixed; inset: 0; z-index: 0; }
  .leaflet-container { background: #2b3b5c; }
  .leaflet-tile-pane { filter: saturate(1.25) hue-rotate(-8deg) brightness(0.95); }

  /* HUD */
  .hud { position: fixed; z-index: 500; left: 0; right: 0; pointer-events: none; padding: 12px 16px; }
  .hud * { pointer-events: auto; }
  .top { top: 0; display: flex; gap: 8px; align-items: center; }
  .chip { background: var(--panel); border-radius: 999px; padding: 8px 14px; font-weight: 600;
    display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.3); font-size: 14px; }
  .lvl { flex: 1; min-width: 0; }
  .xpbar { flex: 1; height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; min-width: 40px; }
  .xpbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .bottom { bottom: 0; display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .round { width: 60px; height: 60px; border-radius: 50%; background: var(--panel); font-size: 26px;
    display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .mainbtn { width: 76px; height: 76px; font-size: 34px; background: radial-gradient(circle at 50% 35%, #fff 0 18%, #e5484d 19% 48%, #222 49% 53%, #fff 54%); }
  .status { position: fixed; z-index: 500; top: 64px; left: 50%; transform: translateX(-50%);
    background: var(--panel); padding: 6px 12px; border-radius: 999px; font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* D-pad for demo mode */
  .dpad { position: fixed; z-index: 500; left: 16px; bottom: 100px; display: none;
    grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px; }
  .dpad.on { display: grid; }
  .dpad button { background: var(--panel); border-radius: 10px; font-size: 18px; }
  .dpad .u { grid-column: 2; grid-row: 1; } .dpad .l { grid-column: 1; grid-row: 2; }
  .dpad .r { grid-column: 3; grid-row: 2; } .dpad .d { grid-column: 2; grid-row: 3; }

  /* Markers */
  .mon { position: relative; line-height: 1; filter: drop-shadow(0 3px 2px rgba(0,0,0,.45));
    animation: bob 1.6s ease-in-out infinite; transition: opacity .3s; }
  .mon.far { opacity: .55; }
  .pk { display: block; width: 56px; height: 56px; image-rendering: pixelated; pointer-events: none; }
  .pk.sm { width: 64px; height: 64px; margin: 0 auto; }
  .pk.lg { width: 140px; height: 140px; margin: 0 auto; }
  .card .pk { width: 72px; height: 72px; margin: 0 auto; }
  .row .pk { width: 48px; height: 48px; }
  .target .body img { width: 150px; height: 150px; object-fit: contain; margin-top: -5px; pointer-events: none; }
  .mon.rare::after { content: ""; position: absolute; inset: 8px; border-radius: 50%;
    box-shadow: 0 0 18px 6px rgba(255, 203, 5, .7); z-index: -1; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .stop { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; background: #3d7dca;
    box-shadow: 0 0 0 4px rgba(61,125,202,.35), 0 3px 6px rgba(0,0,0,.4); display: grid; place-items: center; font-size: 15px; }
  .stop.used { background: #8a63d2; box-shadow: 0 0 0 4px rgba(138,99,210,.3); }
  .player { width: 22px; height: 22px; border-radius: 50%; background: #3d7dca; border: 4px solid #fff;
    box-shadow: 0 0 0 8px rgba(61,125,202,.3), 0 2px 6px rgba(0,0,0,.5); }

  /* Screens */
  .screen { position: fixed; inset: 0; z-index: 1000; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  .sheet { background: var(--bg); overflow-y: auto; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
  .sheet h2 { margin: 4px 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .close { background: rgba(255,255,255,.1); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .card { background: #1b2a4a; border-radius: 14px; padding: 10px 6px; text-align: center; position: relative; }
  .card .e { font-size: 40px; }
  .card .n { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .card .s { font-size: 11px; color: var(--muted); }
  .card.unknown .e { filter: brightness(0) invert(1) opacity(.22); }
  .card .num { position: absolute; top: 6px; left: 8px; font-size: 10px; color: var(--muted); }
  .badge { position: absolute; top: 6px; right: 8px; font-size: 11px; background: var(--accent); color: #222; border-radius: 999px; padding: 0 6px; font-weight: 700; }
  .stats { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .stats div { background: #1b2a4a; border-radius: 12px; padding: 10px 12px; flex: 1; min-width: 90px; }
  .stats b { display: block; font-size: 20px; }
  .stats span { font-size: 12px; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; background: #1b2a4a; border-radius: 12px; padding: 8px 12px; }
  .row .e { font-size: 30px; }
  .row .grow { flex: 1; min-width: 0; }
  .row small { color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 8px; border-radius: 10px; background: #1b2a4a; color: var(--muted); font-weight: 600; }
  .tabs button.on { background: var(--accent2); color: #fff; }
  .btn { background: var(--accent); color: #222; font-weight: 700; padding: 12px 18px; border-radius: 12px; }
  .btn.ghost { background: rgba(255,255,255,.12); color: var(--text); }

  /* Encounter */
  #encounter { background: linear-gradient(#7ec8f0 0 55%, #6fbf5a 55%); touch-action: none; user-select: none; }
  #encounter.night { background: linear-gradient(#1c2350 0 55%, #2d5a3a 55%); }
  .enc-top { padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: flex-start; }
  .enc-name { background: rgba(0,0,0,.45); border-radius: 12px; padding: 8px 14px; }
  .enc-name b { font-size: 18px; } .enc-name small { display: block; opacity: .8; }
  .arena { position: relative; flex: 1; }
  .target { position: absolute; top: 28%; left: 50%; width: 140px; height: 140px; margin-left: -70px; margin-top: -70px; }
  .target .body { font-size: 96px; text-align: center; line-height: 140px; animation: bob 1.4s ease-in-out infinite; }
  .target .ring { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 4px solid; transform: translate(-50%, -50%); pointer-events: none; }
  .target .ring.outer { width: 150px; height: 150px; border-color: rgba(255,255,255,.7); }
  .shadow { position: absolute; left: 50%; top: 100%; width: 90px; height: 16px; margin-left: -45px; margin-top: -10px; border-radius: 50%; background: rgba(0,0,0,.25); }
  .ball { position: absolute; width: 64px; height: 64px; left: 50%; bottom: 60px; margin-left: -32px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #fff 0 14%, #222 15% 20%, transparent 21%),
                linear-gradient(#e5484d 0 46%, #222 46% 54%, #fff 54%);
    box-shadow: 0 6px 12px rgba(0,0,0,.35); touch-action: none; cursor: grab; }
  .ball.great { background: radial-gradient(circle at 50% 50%, #fff 0 14%, #222 15% 20%, transparent 21%),
                linear-gradient(#3d7dca 0 46%, #222 46% 54%, #fff 54%); }
  .ball.ultra { background: radial-gradient(circle at 50% 50%, #fff 0 14%, #222 15% 20%, transparent 21%),
                linear-gradient(#333 0 46%, #ffcb05 46% 54%, #fff 54%); }
  .ball.wobble { animation: wobble .5s ease-in-out 3; }
  @keyframes wobble { 25% { transform: rotate(-25deg); } 75% { transform: rotate(25deg); } }
  .enc-bottom { padding: 12px 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 8px; }
  .ballpick { background: rgba(0,0,0,.4); border-radius: 999px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
  .ballpick.on { background: #fff; color: #222; }
  .hint { position: absolute; left: 0; right: 0; bottom: 150px; padding: 0 16px; text-align: center; color: #fff; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .toast { position: fixed; z-index: 2000; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.8); opacity: 0;
    background: rgba(0,0,0,.75); color: #fff; padding: 14px 22px; border-radius: 14px; font-weight: 700; font-size: 20px;
    text-align: center; pointer-events: none; transition: all .25s; }
  .toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .popup { position: fixed; z-index: 1500; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; padding: 16px; }
  .popup.on { display: flex; }
  .popup .box { background: var(--bg); border-radius: var(--radius); padding: 22px; max-width: 360px; width: 100%; text-align: center; }
  .popup .big { font-size: 80px; }
  .popup p { color: var(--muted); }
  .popup .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="map"></div>

<div class="hud top">
  <div class="chip lvl"><span id="lvlText">Ур. 1</span><div class="xpbar"><i id="xpFill"></i></div></div>
  <div class="chip" id="ballsChip">🔴 <span id="ballsCount">0</span></div>
</div>
<div class="status" id="status">Поиск геолокации…</div>

<div class="dpad" id="dpad">
  <button class="u" data-d="0,1">▲</button>
  <button class="l" data-d="-1,0">◀</button>
  <button class="r" data-d="1,0">▶</button>
  <button class="d" data-d="0,-1">▼</button>
</div>

<div class="hud bottom">
  <button class="round" id="btnCenter" title="Центрировать">🎯</button>
  <button class="round mainbtn" id="btnDex" title="Покедекс"></button>
  <button class="round" id="btnMenu" title="Меню">☰</button>
</div>

<!-- Dex screen -->
<div class="screen sheet" id="dex">
  <h2>Покедекс <button class="close" data-close="dex">✕</button></h2>
  <div class="stats" id="dexStats"></div>
  <div class="tabs">
    <button class="on" data-tab="species">Виды</button>
    <button data-tab="mine">Мои покемоны</button>
  </div>
  <div id="dexBody"></div>
</div>

<!-- Encounter screen -->
<div class="screen" id="encounter">
  <div class="enc-top">
    <div class="enc-name"><b id="encName"></b><small id="encInfo"></small></div>
    <button class="close" id="encRun" title="Убежать">🏃</button>
  </div>
  <div class="arena" id="arena">
    <div class="target" id="target">
      <div class="shadow"></div>
      <div class="ring outer"></div>
      <div class="ring" id="ring"></div>
      <div class="body" id="encBody"></div>
    </div>
    <div class="hint" id="encHint">Смахни покебол вверх, чтобы бросить</div>
    <div class="ball" id="ball"></div>
  </div>
  <div class="enc-bottom" id="ballPicker"></div>
</div>

<!-- Generic popup -->
<div class="popup" id="popup"><div class="box" id="popupBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    { id: 143, name: 'Снорлакс', type: 'Обычный', rarity: 3 },
    { id: 144, name: 'Артикуно', type: 'Лёд', rarity: 5 },
    { id: 145, name: 'Запдос', type: 'Электро', rarity: 5 },
    { id: 146, name: 'Молтрес', type: 'Огонь', rarity: 5 },
    { id: 147, name: 'Дратини', type: 'Дракон', rarity: 2 },
    { id: 148, name: 'Драгонэйр', type: 'Дракон', rarity: 3 },
    { id: 149, name: 'Драгонайт', type: 'Дракон', rarity: 4 },
    { id: 150, name: 'Мьюту', type: 'Психический', rarity: 5 },
    { id: 151, name: 'Мью', type: 'Психический', rarity: 5 },
  ];
  const SPRITE = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
  const sprite = (sp, cls = '') => `<img class="pk ${cls}" src="${SPRITE}${sp.id}.png" alt="${sp.name}" draggable="false">`;
  const artwork = (sp) => `${SPRITE}other/official-artwork/${sp.id}.png`;

  const RARITY = {
    1: { label: 'Обычный',     weight: 50, catchRate: 0.55, flee: 0.08, xp: 100 },
    2: { label: 'Необычный',   weight: 25, catchRate: 0.40, flee: 0.12, xp: 150 },
    3: { label: 'Редкий',      weight: 10, catchRate: 0.25, flee: 0.18, xp: 300 },
    4: { label: 'Эпический',   weight: 3,  catchRate: 0.12, flee: 0.25, xp: 700 },
    5: { label: 'Легендарный', weight: 0.7, catchRate: 0.06, flee: 0.30, xp: 2000 },
  };
  const BALLS = {
    basic: { name: 'Покебол',   icon: '🔴', mult: 1,   css: '' },
    great: { name: 'Грейтбол',  icon: '🔵', mult: 1.5, css: 'great' },
    ultra: { name: 'Ультрабол', icon: '🟡', mult: 2,   css: 'ultra' },
  };

  const CELL = 0.0012;        // ~130 m grid cell
  const VIEW_CELLS = 4;       // cells around player to generate
  const WINDOW_MS = 10 * 60 * 1000; // spawns rotate every 10 min
  const CATCH_RADIUS = 70;    // meters
  const STOP_RADIUS = 50;     // meters
  const STOP_COOLDOWN = 5 * 60 * 1000;
  const DEFAULT_POS = [55.7539, 37.6208]; // Red Square, Moscow

  // ---------- Storage ----------
  const SAVE_KEY = 'pokemon-go-v1';
  const defaultState = () => ({
    xp: 0, balls: { basic: 20, great: 3, ultra: 0 },
    seen: {}, caught: {}, mons: [], gone: {}, stops: {}, totalCaught: 0, walked: 0,
  });
  let S = defaultState();
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) S = Object.assign(defaultState(), JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function dist(a, b) {
    const R = 6371000, toR = Math.PI / 180;
    const dLat = (b[0] - a[0]) * toR, dLng = (b[1] - a[1]) * toR;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  const isNight = () => { const h = new Date().getHours(); return h >= 21 || h < 6; };
  let toastTimer;
  function toast(msg, ms = 1600) {
    const t = $('toast'); t.innerHTML = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), ms);
  }
  function popup(html) { $('popupBox').innerHTML = html; $('popup').classList.add('on'); }
  function closePopup() { $('popup').classList.remove('on'); }
  $('popup').addEventListener('click', (e) => { if (e.target.id === 'popup' || e.target.dataset.ok !== undefined) closePopup(); });

  // ---------- Level ----------
  const levelFromXp = (xp) => { let lvl = 1, need = 1000, rest = xp; while (rest >= need) { rest -= need; lvl++; need = Math.round(need * 1.35); } return { lvl, rest, need }; };
  function addXp(n) {
    const before = levelFromXp(S.xp).lvl; S.xp += n; const after = levelFromXp(S.xp);
    if (after.lvl > before) {
      S.balls.basic += 10; S.balls.great += 5; if (after.lvl >= 5) S.balls.ultra += 3;
      setTimeout(() => popup(`<div class="big">🎉</div><h2>Уровень ${after.lvl}!</h2><p>Награда: покеболы и шанс встретить редких покемонов.</p><button class="btn" data-ok>Круто!</button>`), 600);
    }
    save(); renderHud();
  }
  function renderHud() {
    const { lvl, rest, need } = levelFromXp(S.xp);
    $('lvlText').textContent = 'Ур. ' + lvl;
    $('xpFill').style.width = (rest / need * 100) + '%';
    $('ballsCount').textContent = S.balls.basic + S.balls.great + S.balls.ultra;
  }

  // ---------- Map ----------
  const map = L.map('map', { zoomControl: false, attributionControl: true }).setView(DEFAULT_POS, 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap',
  }).addTo(map);
  const playerMarker = L.marker(DEFAULT_POS, { icon: L.divIcon({ className: '', html: '<div class="player"></div>', iconSize: [22, 22] }), zIndexOffset: 1000 }).addTo(map);
  const rangeCircle = L.circle(DEFAULT_POS, { radius: CATCH_RADIUS, color: '#3d7dca', weight: 2, fillOpacity: 0.08 }).addTo(map);
  const layer = L.layerGroup().addTo(map);

  let pos = null, demo = false, follow = true, lastPos = null;
  map.on('dragstart', () => { follow = false; });

  function setPos(p) {
    if (lastPos) { const d = dist(lastPos, p); if (d < 200) S.walked += d; }
    lastPos = p; pos = p;
    playerMarker.setLatLng(p); rangeCircle.setLatLng(p);
    if (follow) map.panTo(p, { animate: true });
    refreshWorld();
  }

  // ---------- World generation ----------
  function speciesPick(r) {
    const night = isNight();
    const lvl = levelFromXp(S.xp).lvl;
    const pool = SPECIES.map((s) => {
      let w = RARITY[s.rarity].weight;
      if (s.night) w *= night ? 3 : 0.4;
      if (s.rarity >= 4) w *= 1 + lvl * 0.15;
      return [s, w];
    });
    let total = pool.reduce((a, [, w]) => a + w, 0), x = r * total;
    for (const [s, w] of pool) { if ((x -= w) <= 0) return s; }
    return pool[0][0];
  }

  function generate() {
    const win = Math.floor(Date.now() / WINDOW_MS);
    const ci = Math.floor(pos[0] / CELL), cj = Math.floor(pos[1] / CELL);
    const mons = [], stops = [];
    for (let i = ci - VIEW_CELLS; i <= ci + VIEW_CELLS; i++) {
      for (let j = cj - VIEW_CELLS; j <= cj + VIEW_CELLS; j++) {
        // Stops are permanent per cell
        const rs = rng(hash(`stop:${i}:${j}`));
        if (rs() < 0.22) stops.push({ id: `s${i}_${j}`, ll: [(i + rs()) * CELL, (j + rs()) * CELL] });
        // Monsters rotate every time window
        const r = rng(hash(`mon:${i}:${j}:${win}`));
        const n = r() < 0.55 ? (r() < 0.25 ? 2 : 1) : 0;
        for (let k = 0; k < n; k++) {
          const id = `m${i}_${j}_${win}_${k}`;
          const sp = speciesPick(r());
          const lat = (i + r()) * CELL, lng = (j + r()) * CELL;
          const cp = Math.round(10 + r() * 90 * sp.rarity + sp.rarity * 40);
          if (!S.gone[id]) mons.push({ id, sp, ll: [lat, lng], cp });
        }
      }
    }
    return { mons, stops };
  }

  let lastKey = '';
  const markers = new Map();
  function refreshWorld() {
    if (!pos) return;
    const { mons, stops } = generate();
    const key = Math.floor(Date.now() / WINDOW_MS) + ':' + Math.floor(pos[0] / CELL) + ':' + Math.floor(pos[1] / CELL);
    if (key !== lastKey) {
      lastKey = key; layer.clearLayers(); markers.clear();
      stops.forEach((s) => {
        const m = L.marker(s.ll, { icon: stopIcon(s) }).addTo(layer);
        m.on('click', () => useStop(s, m));
        markers.set(s.id, { m, s, kind: 'stop' });
      });
      mons.forEach((mon) => {
        const m = L.marker(mon.ll, { icon: monIcon(mon, false) }).addTo(layer);
        m.on('click', () => tryEncounter(mon));
        markers.set(mon.id, { m, mon, kind: 'mon' });
      });
    }
    // update proximity styling
    let near = 0;
    markers.forEach((v) => {
      if (v.kind === 'mon') {
        const close = dist(pos, v.mon.ll) <= CATCH_RADIUS;
        if (close) near++;
        if (v.close !== close) { v.close = close; v.m.setIcon(monIcon(v.mon, close)); }
      } else {
        v.m.setIcon(stopIcon(v.s));
      }
    });
    $('status').textContent = (demo ? 'Демо-режим · ' : '') + (near ? `Рядом покемонов: ${near}` : 'Гуляй, чтобы найти покемонов');
    cleanupGone();
  }
  function monIcon(mon, close) {
    return L.divIcon({ className: '', iconSize: [56, 56], iconAnchor: [28, 44],
      html: `<div class="mon ${close ? '' : 'far'} ${mon.sp.rarity >= 3 ? 'rare' : ''}">${sprite(mon.sp)}</div>` });
  }
  function stopIcon(s) {
    const used = S.stops[s.id] && Date.now() - S.stops[s.id] < STOP_COOLDOWN;
    return L.divIcon({ className: '', iconSize: [30, 30], html: `<div class="stop ${used ? 'used' : ''}">🎁</div>` });
  }
  function cleanupGone() {
    const win = Math.floor(Date.now() / WINDOW_MS); let changed = false;
    for (const id in S.gone) { if (S.gone[id] < win - 1) { delete S.gone[id]; changed = true; } }
    if (changed) save();
  }
  setInterval(refreshWorld, 15000);

  // ---------- Stops ----------
  function useStop(s, marker) {
    const d = dist(pos, s.ll);
    if (d > STOP_RADIUS) return toast(`Подойди ближе 🚶<br><small>${Math.round(d)} м</small>`);
    const t = S.stops[s.id];
    if (t && Date.now() - t < STOP_COOLDOWN) {
      const left = Math.ceil((STOP_COOLDOWN - (Date.now() - t)) / 60000);
      return toast(`Пусто. Через ~${left} мин`);
    }
    const r = Math.random();
    const got = { basic: 3 + Math.floor(Math.random() * 3), great: r < 0.4 ? 1 + Math.floor(Math.random() * 2) : 0, ultra: r < 0.1 ? 1 : 0 };
    Object.keys(got).forEach((k) => (S.balls[k] += got[k]));
    S.stops[s.id] = Date.now();
    addXp(50);
    marker.setIcon(stopIcon(s));
    const parts = Object.keys(got).filter((k) => got[k]).map((k) => `${BALLS[k].icon} ×${got[k]}`).join('  ');
    toast(`🎁 Получено!<br>${parts}<br><small>+50 XP</small>`, 2200);
  }

  // ---------- Encounter ----------
  let enc = null;
  function tryEncounter(mon) {
    const d = dist(pos, mon.ll);
    if (d > CATCH_RADIUS) return toast(`${sprite(mon.sp, 'sm')}<br>${mon.sp.name} слишком далеко<br><small>${Math.round(d)} м — подойди ближе</small>`);
    if (S.balls.basic + S.balls.great + S.balls.ultra === 0) return toast('Нет покеболов! Найди покестоп 🎁');
    startEncounter(mon);
  }

  function startEncounter(mon) {
    S.seen[mon.sp.id] = true; save();
    const firstBall = S.balls.basic ? 'basic' : S.balls.great ? 'great' : 'ultra';
    enc = { mon, ball: firstBall, busy: false, ringT: 0, x: 0, dir: 1, raf: 0, fails: 0 };
    $('encounter').classList.toggle('night', isNight());
    $('encName').textContent = `${mon.sp.name} · CP ${mon.cp}`;
    $('encInfo').textContent = `${mon.sp.type} · ${RARITY[mon.sp.rarity].label}`;
    $('encBody').innerHTML = `<img src="${artwork(mon.sp)}" alt="${mon.sp.name}" draggable="false">`;
    $('encBody').style.visibility = 'visible';
    $('encHint').textContent = 'Смахни покебол вверх. Бросай, когда кольцо маленькое!';
    resetBall();
    renderBallPicker();
    $('encounter').classList.add('on');
    loop();
  }

  function renderBallPicker() {
    $('ballPicker').innerHTML = Object.keys(BALLS).map((k) =>
      `<button class="ballpick ${enc.ball === k ? 'on' : ''}" data-ball="${k}" ${S.balls[k] ? '' : 'disabled style="opacity:.4"'}>${BALLS[k].icon} ${S.balls[k]}</button>`).join('');
    $('ball').className = 'ball ' + BALLS[enc.ball].css;
  }
  $('ballPicker').addEventListener('click', (e) => {
    const b = e.target.closest('[data-ball]'); if (!b || !enc || enc.busy || !S.balls[b.dataset.ball]) return;
    enc.ball = b.dataset.ball; renderBallPicker();
  });

  function ringColor(rarity) { return ['#30a46c', '#30a46c', '#f5d90a', '#f76b15', '#e5484d', '#8e4ec6'][rarity]; }
  function loop() {
    if (!enc) return;
    const target = $('target'), ring = $('ring');
    const speed = 0.6 + enc.mon.sp.rarity * 0.35;
    if (!enc.busy) {
      enc.ringT = (enc.ringT + 0.012) % 1;
      // monster drifts side to side
      const max = Math.min(120, window.innerWidth / 2 - 80);
      enc.x += enc.dir * speed; if (Math.abs(enc.x) > max) { enc.dir *= -1; enc.x = Math.sign(enc.x) * max; }
    }
    const size = 150 - 115 * Math.sin(enc.ringT * Math.PI); // 150 → 35 → 150
    ring.style.width = ring.style.height = size + 'px';
    ring.style.borderColor = ringColor(enc.mon.sp.rarity);
    target.style.transform = `translateX(${enc.x}px)`;
    enc.ringSize = size;
    enc.raf = requestAnimationFrame(loop);
  }

  function endEncounter() {
    if (!enc) return;
    cancelAnimationFrame(enc.raf); enc = null;
    $('encounter').classList.remove('on');
    refreshWorld();
  }
  $('encRun').addEventListener('click', endEncounter);

  // Ball swipe
  const ball = $('ball');
  let drag = null;
  function resetBall() {
    ball.style.transition = 'none'; ball.style.transform = ''; ball.style.left = ''; ball.style.top = ''; ball.style.bottom = '';
    ball.classList.remove('wobble'); ball.style.opacity = 1;
  }
  ball.addEventListener('pointerdown', (e) => {
    if (!enc || enc.busy) return;
    ball.setPointerCapture(e.pointerId);
    drag = { x0: e.clientX, y0: e.clientY, t0: performance.now(), x: e.clientX, y: e.clientY, pts: [] };
    ball.style.transition = 'none';
  });
  ball.addEventListener('pointermove', (e) => {
    if (!drag) return;
    drag.x = e.clientX; drag.y = e.clientY; drag.pts.push([e.clientX, e.clientY, performance.now()]);
    if (drag.pts.length > 6) drag.pts.shift();
    ball.style.transform = `translate(${e.clientX - drag.x0}px, ${e.clientY - drag.y0}px)`;
  });
  ball.addEventListener('pointerup', () => {
    if (!drag) return;
    const d = drag; drag = null;
    const p0 = d.pts[0] || [d.x0, d.y0, d.t0];
    const dy = d.y - p0[1], dx = d.x - p0[0];
    if (d.y0 - d.y < 60 || dy > -10) { ball.style.transition = 'transform .25s'; ball.style.transform = ''; return; }
    throwBall(dx / Math.max(1, -dy));
  });

  function throwBall(slope) {
    if (S.balls[enc.ball] <= 0) return toast('Закончились такие покеболы');
    enc.busy = true;
    S.balls[enc.ball]--; save(); renderHud(); renderBallPicker();

    const arena = $('arena').getBoundingClientRect();
    const tgt = $('target').getBoundingClientRect();
    const ballR = ball.getBoundingClientRect();
    const startX = ballR.left + ballR.width / 2, startY = ballR.top + ballR.height / 2;
    const tgtX = tgt.left + tgt.width / 2, tgtY = tgt.top + tgt.height / 2;
    const travel = startY - tgtY;
    const landX = startX + slope * travel;
    const hit = Math.abs(landX - tgtX) < 60;
    const ringSize = enc.ringSize;

    // fly animation
    const endX = hit ? tgtX : landX, endY = hit ? tgtY : tgtY - 40;
    ball.style.transition = 'transform .55s cubic-bezier(.3,.7,.4,1)';
    ball.style.transform = `translate(${endX - startX}px, ${endY - startY}px) scale(.45) rotate(720deg)`;

    setTimeout(() => {
      if (!enc) return;
      if (!hit) {
        ball.style.opacity = 0; toast('Мимо!', 900);
        setTimeout(() => { if (enc) { resetBall(); enc.busy = false; } }, 500);
        return;
      }
      // Hit — compute catch chance
      let bonus = 1, label = '';
      if (ringSize < 60) { bonus = 1.85; label = 'Отлично!'; }
      else if (ringSize < 100) { bonus = 1.4; label = 'Хорошо!'; }
      else { bonus = 1.1; label = 'Неплохо'; }
      const base = RARITY[enc.mon.sp.rarity].catchRate;
      const chance = Math.min(0.97, base * BALLS[enc.ball].mult * bonus * (1 + enc.fails * 0.08));
      const success = Math.random() < chance;
      toast(label, 700);
      $('encBody').style.visibility = 'hidden';
      // Ball sits on ground and wobbles
      ball.style.transition = 'transform .3s';
      ball.style.transform = `translate(${tgtX - startX}px, ${tgtY - startY + 40}px) scale(.6)`;
      const wobbles = success ? 3 : 1 + Math.floor(Math.random() * 3);
      let w = 0;
      const doWobble = () => {
        if (!enc) return;
        if (w++ >= wobbles) return finishThrow(success);
        ball.animate([{ rotate: '0deg' }, { rotate: '-25deg' }, { rotate: '25deg' }, { rotate: '0deg' }], { duration: 500, composite: 'add' });
        setTimeout(doWobble, 750);
      };
      setTimeout(doWobble, 500);
    }, 560);
  }

  function finishThrow(success) {
    const mon = enc.mon;
    if (success) {
      const sp = mon.sp, first = !S.caught[sp.id];
      S.caught[sp.id] = (S.caught[sp.id] || 0) + 1;
      S.totalCaught++;
      S.mons.unshift({ sp: sp.id, cp: mon.cp, t: Date.now() });
      if (S.mons.length > 500) S.mons.length = 500;
      S.gone[mon.id] = Math.floor(Date.now() / WINDOW_MS);
      const xp = RARITY[sp.rarity].xp + (first ? 500 : 0);
      save();
      cancelAnimationFrame(enc.raf); enc = null;
      $('encounter').classList.remove('on');
      addXp(xp);
      popup(`<div class="big">${sprite(sp, 'lg')}</div><h2>Пойман ${sp.name}!</h2>
        <p>CP ${mon.cp} · ${RARITY[sp.rarity].label}<br>+${xp} XP${first ? ' (новый вид!)' : ''}</p>
        <button class="btn" data-ok>Отлично</button>`);
      refreshWorld();
      return;
    }
    $('encBody').style.visibility = 'visible';
    enc.fails++;
    if (Math.random() < RARITY[mon.sp.rarity].flee + enc.fails * 0.03) {
      S.gone[mon.id] = Math.floor(Date.now() / WINDOW_MS); save();
      $('encBody').style.visibility = 'hidden';
      toast(`${mon.sp.name} убежал…`, 1500);
      setTimeout(endEncounter, 1300);
      return;
    }
    toast('Вырвался!', 900);
    resetBall(); enc.busy = false;
    if (!S.balls.basic && !S.balls.great && !S.balls.ultra) { toast('Покеболы закончились', 1400); setTimeout(endEncounter, 1200); }
    else if (!S.balls[enc.ball]) { enc.ball = S.balls.basic ? 'basic' : S.balls.great ? 'great' : 'ultra'; renderBallPicker(); }
  }

  // ---------- Dex ----------
  let dexTab = 'species';
  function renderDex() {
    const caughtSpecies = Object.keys(S.caught).length;
    $('dexStats').innerHTML = `
      <div><b>${caughtSpecies}/${SPECIES.length}</b><span>видов поймано</span></div>
      <div><b>${S.totalCaught}</b><span>всего покемонов</span></div>
      <div><b>${(S.walked / 1000).toFixed(2)} км</b><span>пройдено</span></div>`;
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === dexTab));
    if (dexTab === 'species') {
      $('dexBody').innerHTML = '<div class="grid">' + SPECIES.map((s) => {
        const c = S.caught[s.id], seen = S.seen[s.id];
        return `<div class="card ${c ? '' : 'unknown'}"><span class="num">#${String(s.id).padStart(3, '0')}</span>
          ${c ? `<span class="badge">×${c}</span>` : ''}
          <div class="e">${sprite(s)}</div><div class="n">${c || seen ? s.name : '???'}</div>
          <div class="s">${c ? s.type + ' · ' + RARITY[s.rarity].label : seen ? 'Встречен' : 'Не найден'}</div></div>`;
      }).join('') + '</div>';
    } else {
      $('dexBody').innerHTML = S.mons.length ? '<div class="list">' + S.mons.map((m) => {
        const s = SPECIES.find((x) => x.id === m.sp);
        return `<div class="row"><div class="e">${sprite(s)}</div><div class="grow"><b>${s.name}</b><br>
          <small>${s.type} · ${new Date(m.t).toLocaleDateString('ru-RU')}</small></div><b>CP ${m.cp}</b></div>`;
      }).join('') + '</div>' : '<p style="color:var(--muted)">Пока никого. Выходи на прогулку!</p>';
    }
  }
  document.querySelector('.tabs').addEventListener('click', (e) => { if (e.target.dataset.tab) { dexTab = e.target.dataset.tab; renderDex(); } });
  $('btnDex').addEventListener('click', () => { renderDex(); $('dex').classList.add('on'); });
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => $(b.dataset.close).classList.remove('on')));

  $('btnCenter').addEventListener('click', () => { follow = true; if (pos) map.setView(pos, 17); });

  $('btnMenu').addEventListener('click', () => {
    popup(`<h2>Меню</h2>
      <p>Гуляй по-настоящему — покемоны появляются рядом с тобой и меняются каждые 10 минут. 🎁 — покестопы с покеболами.</p>
      <div class="actions" style="flex-direction:column">
        <button class="btn" id="mDemo">${demo ? 'Вернуться к GPS' : 'Демо-режим (без GPS)'}</button>
        <button class="btn ghost" id="mReset">Сбросить прогресс</button>
        <button class="btn ghost" data-ok>Закрыть</button>
      </div>`);
    $('mDemo').onclick = () => { closePopup(); demo ? startGps() : startDemo(); };
    $('mReset').onclick = () => {
      if (confirm('Удалить весь прогресс?')) { S = defaultState(); save(); renderHud(); lastKey = ''; refreshWorld(); closePopup(); toast('Прогресс сброшен'); }
    };
  });

  // ---------- Location ----------
  let watchId = null;
  function startGps() {
    if (!('geolocation' in navigator)) return startDemo('Геолокация не поддерживается');
    demo = false; $('dpad').classList.remove('on');
    $('status').textContent = 'Поиск геолокации…';
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    let got = false;
    watchId = navigator.geolocation.watchPosition(
      (p) => { if (demo) return; if (!got) { got = true; follow = true; map.setView([p.coords.latitude, p.coords.longitude], 17); } setPos([p.coords.latitude, p.coords.longitude]); },
      (err) => { if (!got) startDemo(err.code === 1 ? 'Доступ к геолокации запрещён' : 'Не удалось определить местоположение'); },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
    );
  }
  function startDemo(reason) {
    demo = true;
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    $('dpad').classList.add('on');
    follow = true;
    setPos(pos || DEFAULT_POS);
    map.setView(pos, 17);
    popup(`<div class="big">🗺️</div><h2>Демо-режим</h2>
      <p>${reason ? reason + '. ' : ''}Двигайся стрелками на экране или клавишами WASD / ↑↓←→. Двойной тап по карте — телепорт.</p>
      <button class="btn" data-ok>Поехали!</button>`);
  }
  const STEP = 0.00012; // ~13 m
  function move(dx, dy) { if (!demo || !pos) return; follow = true; setPos([pos[0] + dy * STEP, pos[1] + dx * STEP / Math.cos(pos[0] * Math.PI / 180)]); }
  let holdTimer;
  document.querySelectorAll('#dpad button').forEach((b) => {
    const [dx, dy] = b.dataset.d.split(',').map(Number);
    const start = (e) => { e.preventDefault(); move(dx, dy); clearInterval(holdTimer); holdTimer = setInterval(() => move(dx, dy), 120); };
    const stop = () => clearInterval(holdTimer);
    b.addEventListener('pointerdown', start); b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
  });
  const KEYS = { ArrowUp: [0, 1], KeyW: [0, 1], ArrowDown: [0, -1], KeyS: [0, -1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
  window.addEventListener('keydown', (e) => { if (KEYS[e.code] && !enc) { e.preventDefault(); move(...KEYS[e.code]); } });
  map.doubleClickZoom.disable();
  map.on('dblclick', (e) => { if (demo) { follow = true; setPos([e.latlng.lat, e.latlng.lng]); } });

  renderHud();
  startGps();
})();
</script>
</body>
</html>
